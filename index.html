<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KATLANIR GPT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; height: 100vh; }
    
    header { background-color: #181825; padding: 15px 20px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.4rem; color: #89b4fa; letter-spacing: 1px; }
    
    .status-badge { background: #313244; color: #a6adc8; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #45475a; }
    
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
    .user-message { background-color: #89b4fa; color: #11111b; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 500; }
    .ai-message { background-color: #313244; color: #cdd6f4; align-self: flex-start; border-bottom-left-radius: 2px; }
    
    .input-container { display: flex; padding: 15px; background-color: #181825; border-top: 1px solid #313244; gap: 10px; }
    textarea { flex: 1; background-color: #313244; border: 1px solid #45475a; color: #cdd6f4; padding: 12px; border-radius: 8px; resize: none; height: 48px; font-size: 0.95rem; outline: none; }
    textarea:focus { border-color: #89b4fa; }
    
    button { background-color: #89b4fa; color: #11111b; border: none; padding: 0 22px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #b4befe; }
    
    footer { background-color: #11111b; text-align: center; padding: 10px; font-weight: bold; color: #f38ba8; font-size: 0.9rem; letter-spacing: 1.5px; border-top: 1px solid #181825; }
  </style>
</head>
<body>

  <header>
    <h1>KATLANIR GPT</h1>
    <div class="status-badge">⚡ Hazır</div>
  </header>

  <div id="chat-box">
    <div class="message ai-message">Selam kanka! Ben KATLANIR GPT. Flash bellekten çalışıyorum, nasıl yardımcı olabilirim?</div>
  </div>

  <div class="input-container">
    <textarea id="userInput" placeholder="Bir şeyler yaz... (Göndermek için Enter'a bas)"></textarea>
    <button onclick="sendMessage()">Gönder</button>
  </div>

  <footer>HmaX BABA YAPTI...</footer>

  <script>
    const defaultApiKey = "AQ.Ab8RN6Jh_i5HS65yhuCgxi48qX8eDnm-YnnBRrPSEcgmg3MMMQ"; 

    const userInput = document.getElementById('userInput');
    const chatBox = document.getElementById('chat-box');

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const text = userInput.value.trim();

      if (!text) return;

      appendMessage(text, 'user-message');
      userInput.value = '';

      const loadingDiv = appendMessage("Düşünüyor...", 'ai-message');

      try {
        // Güncel model: gemini-3.6-flash
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${defaultApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          loadingDiv.innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          loadingDiv.innerText = "Hata: " + data.error.message;
        } else {
          loadingDiv.innerText = "Bir hata oluştu veya API anahtarı geçersiz.";
        }
      } catch (err) {
        loadingDiv.innerText = "Bağlantı hatası! İnternet erişimini kontrol et.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(text, className) {
      const msg = document.createElement('div');
      msg.className = `message ${className}`;
      msg.innerText = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }
  </script>
</body>
</html>
